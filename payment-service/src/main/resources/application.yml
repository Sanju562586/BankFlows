server:
  port: 8082

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankflow_payments}
    username: ${SPRING_DATASOURCE_USERNAME:bankflow}
    password: ${SPRING_DATASOURCE_PASSWORD:bankflow_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

bankflow:
  payment:
    limits:
      upi-max: 100000.00
      imps-max: 500000.00